name: RSKj Truffle Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Daily at 1:15 AM UTC
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'RSKj Repository'
        required: false
        default: 'rsksmart/rskj.git'
        type: string
      version:
        description: 'RSKj Version'
        required: false
        type: string
      branch:
        description: 'RSKj Branch'
        required: false
        default: 'master'
        type: string
      slack_channel:
        description: 'Slack Channel'
        required: false
        default: 'integration-tests'
        type: string

env:
  RSKJ_REPO: ${{ github.event.inputs.repo || 'rsksmart/rskj.git' }}
  RSKJ_VERSION: ${{ github.event.inputs.version || '' }}
  RSKJ_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  SLACK_CHANNEL: ${{ github.event.inputs.slack_channel || 'integration-tests' }}

jobs:
  rskj-truffle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache RSKj build
        uses: actions/cache@v4
        id: cache-rskj
        with:
          path: |
            ~/rsksmart/rskj/.gradle
            ~/rsksmart/rskj/rskj-core/build
          key: rskj-${{ env.RSKJ_REPO }}-${{ env.RSKJ_BRANCH }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            rskj-${{ env.RSKJ_REPO }}-${{ env.RSKJ_BRANCH }}-
            rskj-${{ env.RSKJ_REPO }}-

      - name: Clone RSKj repository
        if: steps.cache-rskj.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/rsksmart
          git clone -b ${{ env.RSKJ_BRANCH }} --depth 1 https://github.com/${{ env.RSKJ_REPO }} ~/rsksmart/rskj

      - name: Build RSKj
        if: steps.cache-rskj.outputs.cache-hit != 'true'
        run: |
          cd ~/rsksmart/rskj/
          ./configure.sh
          
          # Apply RSKIP configuration changes
          sed -i 's/rskip144 = 1/rskip144 = -1/' rskj-core/src/main/resources/config/regtest.conf
          sed -i 's/rskip351 = 1/rskip351 = -1/' rskj-core/src/main/resources/config/regtest.conf
          
          # Build with parallel execution and memory optimization
          ./gradlew clean build -x test --parallel --max-workers=4 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Get RSKj version
        run: |
          cd ~/rsksmart/rskj/rskj-core/build/libs/
          f=`ls *-all.jar`
          version=`echo $f | cut -c 11-15`
          echo "VERSION_FOR_SLACK=${version}" >> $GITHUB_ENV
          echo "RSKj version: ${version}"

      - name: Install dependencies
        run: |
          npm ci --omit=optional --ignore-scripts --no-optional
          truffle_version=`npx truffle version | cut -c 1-15 | head -1`
          echo "TRUFFLE_VERSION_FOR_SLACK=${truffle_version}" >> $GITHUB_ENV
          echo "Truffle version: ${truffle_version}"
        env:
          npm_config_optional: false

      - name: Start RSKj
        run: |
          # Start RSKj in background with optimized JVM settings
          java \
            -Dminer.client.autoMine=true \
            -Dtransaction.accountTxRateLimit.enabled=false \
            -Dkeyvalue.datasource=rocksdb \
            -Xmx4g \
            -XX:+UseG1GC \
            -XX:MaxGCPauseMillis=200 \
            -cp ~/rsksmart/rskj/rskj-core/build/libs/rskj-core-*-all.jar \
            co.rsk.Start --regtest &
          
          # Wait for RSKj to be ready
          echo "Waiting for RSKj to start..."
          timeout 120 bash -c 'until nc -z 127.0.0.1 4444; do echo "Waiting for RSKj..."; sleep 2; done'
          echo "RSKj is ready!"

      - name: Run Truffle tests
        run: |
          # Run tests with timeout and better reporting
          timeout 900 npm test || (echo "Tests timed out or failed" && exit 1)

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: |
            results/
            test-results/
            coverage/
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_id }}
          path: |
            logs/
            *.log
          retention-days: 30

      - name: Upload RSKj logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rskj-logs-${{ github.run_id }}
          path: ~/rsksmart/rskj/logs/
          retention-days: 30

      - name: Notify Slack on Success
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: ${{ env.SLACK_CHANNEL }}
          text: |
            :white_check_mark: RskJ Truffle Tests Passed
            
            *RSKj Repository*: ${{ env.RSKJ_REPO }}
            *RSKj Branch*: ${{ env.RSKJ_BRANCH }}
            *RSKj Version*: ${{ env.VERSION_FOR_SLACK }}
            *Tests Branch*: ${{ github.ref_name }}
            *Truffle Version*: ${{ env.TRUFFLE_VERSION_FOR_SLACK }}
            *Requester*: ${{ github.actor }}
            *Duration*: ${{ github.event.workflow_run.duration || 'N/A' }}
            
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Job>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on Failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: ${{ env.SLACK_CHANNEL }}
          text: |
            :red_circle: RskJ Truffle Tests Failed
            
            *RSKj Repository*: ${{ env.RSKJ_REPO }}
            *RSKj Branch*: ${{ env.RSKJ_BRANCH }}
            *RSKj Version*: ${{ env.VERSION_FOR_SLACK }}
            *Tests Branch*: ${{ github.ref_name }}
            *Truffle Version*: ${{ env.TRUFFLE_VERSION_FOR_SLACK }}
            *Requester*: ${{ github.actor }}
            *Duration*: ${{ github.event.workflow_run.duration || 'N/A' }}
            
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Job>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 