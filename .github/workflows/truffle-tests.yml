name: RSKj Truffle Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Daily at 1:15 AM UTC
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'RSKj Repository'
        required: false
        default: 'rsksmart/rskj.git'
        type: string
      version:
        description: 'RSKj Version'
        required: false
        type: string
      branch:
        description: 'RSKj Branch'
        required: false
        default: 'master'
        type: string
      slack_channel:
        description: 'Slack Channel'
        required: false
        default: 'integration-tests'
        type: string

env:
  RSKJ_REPO: ${{ github.event.inputs.repo || 'rsksmart/rskj.git' }}
  RSKJ_VERSION: ${{ github.event.inputs.version || '' }}
  RSKJ_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  SLACK_CHANNEL: ${{ github.event.inputs.slack_channel || 'integration-tests' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Configure SSH for GitHub
        run: |
          mkdir -p ~/.ssh/
          echo -e "Host github.com\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Clone and Build RSKj
        run: |
          git clone -b ${{ env.RSKJ_BRANCH }} git@github.com:${{ env.RSKJ_REPO }} ~/rsksmart/rskj
          cd ~/rsksmart/rskj/
          ./configure.sh
          sed 's/rskip144 = 1/rskip144 = -1/' rskj-core/src/main/resources/config/regtest.conf > rskj-core/src/main/resources/config/temp.conf && mv -f rskj-core/src/main/resources/config/temp.conf rskj-core/src/main/resources/config/regtest.conf
          sed 's/rskip351 = 1/rskip351 = -1/' rskj-core/src/main/resources/config/regtest.conf > rskj-core/src/main/resources/config/temp.conf && mv -f rskj-core/src/main/resources/config/temp.conf rskj-core/src/main/resources/config/regtest.conf
          ./gradlew clean build -x test
          cd ~/rsksmart/rskj/rskj-core/build/libs/
          f=`ls *-all.jar`
          version=`echo $f | cut -c 11-15`
          echo "VERSION_FOR_SLACK=${version}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm ci --no-optional
          truffle_version=`npx truffle version | cut -c 1-15 | head -1`
          echo "TRUFFLE_VERSION_FOR_SLACK=${truffle_version}" >> $GITHUB_ENV

      - name: Start RSKj and Run Tests
        run: |
          java -Dminer.client.autoMine=true -Dtransaction.accountTxRateLimit.enabled=false -Dkeyvalue.datasource=rocksdb -cp ~/rsksmart/rskj/rskj-core/build/libs/rskj-core-*-all.jar co.rsk.Start --regtest &
          until nc -z 127.0.0.1 4444
          do
            echo "Waiting for RSKj..."
            sleep 1
          done
          npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results/
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: logs/
          retention-days: 30

      - name: Notify Slack on Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: ${{ env.SLACK_CHANNEL }}
          text: |
            :white_check_mark: RskJ Truffle Tests Passed
            
            *RSKj Repository*: ${{ env.RSKJ_REPO }}
            *RSKj Branch*: ${{ env.RSKJ_BRANCH }}
            *RSKj Version*: ${{ env.VERSION_FOR_SLACK }}
            *Tests Branch*: ${{ github.ref_name }}
            *Truffle Version*: ${{ env.TRUFFLE_VERSION_FOR_SLACK }}
            *Requester*: ${{ github.actor }}
            
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Job>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: ${{ env.SLACK_CHANNEL }}
          text: |
            :red_circle: RskJ Truffle Tests Failed
            
            *RSKj Repository*: ${{ env.RSKJ_REPO }}
            *RSKj Branch*: ${{ env.RSKJ_BRANCH }}
            *RSKj Version*: ${{ env.VERSION_FOR_SLACK }}
            *Tests Branch*: ${{ github.ref_name }}
            *Truffle Version*: ${{ env.TRUFFLE_VERSION_FOR_SLACK }}
            *Requester*: ${{ github.actor }}
            
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Job>
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 